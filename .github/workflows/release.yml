name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: Build binaries and create GitHub Release
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries for all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for plat in linux-amd64 linux-arm64 windows-amd64 darwin-amd64 darwin-arm64; do
            goos="${plat%%-*}"
            goarch="${plat##*-}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            go build -trimpath -ldflags="-s -w" -o "dist/kuebiko-${goos}-${goarch}${ext}" .
            mkdir -p "pkg/${plat}"
            cp "dist/kuebiko-${goos}-${goarch}${ext}" README.md LICENSE "pkg/${plat}/"
            (cd "pkg/${plat}" && zip -q "../../kuebiko-${TAG}-${plat}.zip" .)
            rm -rf "pkg/${plat}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            dist/*
