{{define "document_form_title"}}{{if .Document}}{{t .Lang "memo_edit"}}{{else}}{{t .Lang "memo_add"}}{{end}}{{end}}
{{define "document_form_content"}}
<div class="card">
    <h2>{{if .Document}}{{t .Lang "memo_edit"}}{{else}}{{t .Lang "memo_add"}}{{end}}</h2>
    <form method="post" action="{{if .Document}}/documents/edit?id={{.Document.ID}}{{else}}/documents/new{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group">
            <label for="title">{{t .Lang "title"}}</label>
            <input type="text" id="title" name="title" value="{{if .Document}}{{.Document.Title}}{{end}}" required>
        </div>
        <div class="form-group">
            <label for="content">{{t .Lang "content_markdown"}}</label>
            <textarea id="content" name="content" rows="20" required>{{if .Document}}{{.Document.Content}}{{end}}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">{{t .Lang "save"}}</button>
        <a href="/documents" class="btn">{{t .Lang "cancel"}}</a>
    </form>
</div>
{{end}}
