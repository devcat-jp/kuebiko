{{define "document_form_title"}}{{if .Document}}ドキュメント編集{{else}}ドキュメント追加{{end}}{{end}}
{{define "document_form_content"}}
<div class="card">
    <h2>{{if .Document}}ドキュメント編集{{else}}ドキュメント追加{{end}}</h2>
    <form method="post" action="{{if .Document}}/documents/edit?id={{.Document.ID}}{{else}}/documents/new{{end}}">
        <div class="form-group">
            <label for="title">タイトル</label>
            <input type="text" id="title" name="title" value="{{if .Document}}{{.Document.Title}}{{end}}" required>
        </div>
        <div class="form-group">
            <label for="content">内容（Markdown）</label>
            <textarea id="content" name="content" rows="20" required>{{if .Document}}{{.Document.Content}}{{end}}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/documents" class="btn">キャンセル</a>
    </form>
</div>
{{end}}
