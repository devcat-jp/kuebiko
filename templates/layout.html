{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - {{appName}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">{{appName}}</a></h1>
            {{if .User}}
            <nav>
                <a href="/">ダッシュボード</a>
                <a href="/secrets">金融情報</a>
                <a href="/documents">ドキュメント</a>
                <a href="/recipients">受信者</a>
                <a href="/settings">設定</a>
                <a href="/logout">ログアウト</a>
            </nav>
            {{end}}
        </div>
    </header>
    <main class="container">
        {{if .Flash}}
        <div class="flash flash-{{.FlashType}}">{{.Flash}}</div>
        {{end}}
        {{.Content}}
    </main>
    <footer class="container">
        <p>ローカル専用 {{appName}}</p>
    </footer>
    <script>
        function togglePasswordVisibility(button) {
            var targetId = button.getAttribute('data-target');
            var input = document.getElementById(targetId);
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '非表示';
            } else {
                input.type = 'password';
                button.textContent = '表示';
            }
        }

        (function () {
            function initSortableTable(table) {
                var tbody = table.querySelector('tbody');
                if (!tbody) return;
                var draggedRow = null;
                var rows = tbody.querySelectorAll('tr[draggable="true"]');

                rows.forEach(function (row) {
                    row.addEventListener('dragstart', function (e) {
                        draggedRow = row;
                        row.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });
                    row.addEventListener('dragend', function () {
                        row.classList.remove('dragging');
                        draggedRow = null;
                        saveOrder(table);
                    });
                    row.addEventListener('dragover', function (e) {
                        e.preventDefault();
                        if (!draggedRow || draggedRow === row) return;
                        var rect = row.getBoundingClientRect();
                        var next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                        if (next) {
                            tbody.insertBefore(draggedRow, row.nextSibling);
                        } else {
                            tbody.insertBefore(draggedRow, row);
                        }
                    });
                });
            }

            function saveOrder(table) {
                var url = table.getAttribute('data-reorder-url');
                if (!url) return;
                var rows = table.querySelectorAll('tbody tr[draggable="true"]');
                var params = new URLSearchParams();
                rows.forEach(function (row) {
                    params.append('id', row.getAttribute('data-id'));
                });
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                }).catch(function (err) {
                    console.error('並び順の保存に失敗しました', err);
                });
            }

            document.querySelectorAll('.sortable-table').forEach(initSortableTable);
        })();
    </script>
</body>
</html>
{{end}}
