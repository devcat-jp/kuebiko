{{define "recipient_form_title"}}{{if .Recipient}}{{t .Lang "recipient_edit"}}{{else}}{{t .Lang "recipient_add"}}{{end}}{{end}}
{{define "recipient_form_content"}}
<div class="card">
    <h2>{{if .Recipient}}{{t .Lang "recipient_edit"}}{{else}}{{t .Lang "recipient_add"}}{{end}}</h2>
    <form method="post" action="{{if .Recipient}}/recipients/edit?id={{.Recipient.ID}}{{else}}/recipients/new{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group">
            <label for="name">{{t .Lang "name"}}</label>
            <input type="text" id="name" name="name" value="{{if .Recipient}}{{.Recipient.Name}}{{end}}">
        </div>
        <div class="form-group">
            <label for="email">{{t .Lang "email_address"}}</label>
            <input type="email" id="email" name="email" value="{{if .Recipient}}{{.Recipient.Email}}{{end}}" required>
        </div>
        <button type="submit" class="btn btn-primary">{{t .Lang "save"}}</button>
        <a href="/recipients" class="btn">{{t .Lang "cancel"}}</a>
    </form>
</div>
{{end}}
