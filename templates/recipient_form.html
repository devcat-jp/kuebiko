{{define "recipient_form_title"}}{{if .Recipient}}受信者編集{{else}}受信者追加{{end}}{{end}}
{{define "recipient_form_content"}}
<div class="card">
    <h2>{{if .Recipient}}受信者編集{{else}}受信者追加{{end}}</h2>
    <form method="post" action="{{if .Recipient}}/recipients/edit?id={{.Recipient.ID}}{{else}}/recipients/new{{end}}">
        <div class="form-group">
            <label for="name">名前</label>
            <input type="text" id="name" name="name" value="{{if .Recipient}}{{.Recipient.Name}}{{end}}">
        </div>
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" value="{{if .Recipient}}{{.Recipient.Email}}{{end}}" required>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/recipients" class="btn">キャンセル</a>
    </form>
</div>
{{end}}
