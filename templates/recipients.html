{{define "recipients_title"}}受信者一覧{{end}}
{{define "recipients_content"}}
<h2>受信者一覧</h2>
<p>久延毘古（くえびこ）作動時に情報を送信するメールアドレスを管理します。</p>
<a href="/recipients/new" class="btn btn-primary">受信者を追加</a>

<table class="data-table sortable-table" data-reorder-url="/recipients/reorder">
    <thead>
        <tr>
            <th class="drag-handle-header"></th>
            <th>名前</th>
            <th>メールアドレス</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {{range .Recipients}}
        <tr draggable="true" data-id="{{.ID}}">
            <td class="drag-handle">⋮⋮</td>
            <td>{{.Name}}</td>
            <td>{{.Email}}</td>
            <td>
                <a href="/recipients/edit?id={{.ID}}" class="btn btn-small">編集</a>
                <form method="post" action="/recipients/delete?id={{.ID}}" style="display:inline" onsubmit="return confirm('削除しますか？');">
                    <button type="submit" class="btn btn-danger btn-small">削除</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="4">受信者が登録されていません。</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
