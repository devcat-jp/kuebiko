{{define "secret_form_title"}}{{if .Secret}}ログイン情報編集{{else}}ログイン情報追加{{end}}{{end}}
{{define "secret_form_content"}}
<div class="card">
    <h2>{{if .Secret}}ログイン情報編集{{else}}ログイン情報追加{{end}}</h2>
    <form method="post" action="{{if .Secret}}/secrets/edit?id={{.Secret.ID}}{{else}}/secrets/new{{end}}" id="secret-form">
        <div class="form-row">
            <label for="title">タイトル</label>
            <input type="text" id="title" name="title" value="{{if .Secret}}{{.Secret.Title}}{{end}}" required>
        </div>
        <div class="form-row">
            <label for="url">URL</label>
            <input type="url" id="url" name="url" value="{{if .SecretPayload}}{{.SecretPayload.URL}}{{end}}" placeholder="https://example.com">
        </div>
        <div class="form-row">
            <label for="id">ID</label>
            <input type="text" id="id" name="id" value="{{if .SecretPayload}}{{.SecretPayload.ID}}{{end}}">
        </div>
        <div class="form-row">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" value="{{if .SecretPayload}}{{.SecretPayload.Password}}{{end}}">
        </div>
        <div class="form-row">
            <label for="memo">メモ</label>
            <textarea id="memo" name="memo" rows="3" placeholder="自由に記入してください">{{if .SecretPayload}}{{.SecretPayload.Memo}}{{end}}</textarea>
        </div>

        <h3>追加項目</h3>
        <div id="extra-fields">
            {{if .SecretPayload}}
                {{range $i, $f := .SecretPayload.Fields}}
                <div class="extra-field-row">
                    <input type="text" name="field_name" placeholder="項目名" value="{{$f.Name}}" required>
                    <input type="{{if $f.Hidden}}password{{else}}text{{end}}" name="field_value" placeholder="値" value="{{$f.Value}}">
                    <input type="hidden" name="field_hidden" value="{{if $f.Hidden}}1{{else}}0{{end}}">
                    <label class="toggle-label" title="値を隠す">
                        <input type="checkbox" onchange="toggleHidden(this)" {{if $f.Hidden}}checked{{end}}>
                        👁
                    </label>
                    <button type="button" class="btn btn-danger btn-icon" onclick="removeField(this)" title="削除">🗑</button>
                </div>
                {{end}}
            {{end}}
        </div>
        <button type="button" class="btn" onclick="addField()">項目を追加</button>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/secrets" class="btn">キャンセル</a>
        </div>
    </form>
</div>

<script>
function addField(name, value, hidden) {
    name = name || '';
    value = value || '';
    hidden = hidden || false;
    const container = document.getElementById('extra-fields');
    const row = document.createElement('div');
    row.className = 'extra-field-row';
    row.innerHTML = `
        <input type="text" name="field_name" placeholder="項目名" value="${escapeHtml(name)}" required>
        <input type="${hidden ? 'password' : 'text'}" name="field_value" placeholder="値" value="${escapeHtml(value)}">
        <input type="hidden" name="field_hidden" value="${hidden ? '1' : '0'}">
        <label class="toggle-label" title="値を隠す">
            <input type="checkbox" onchange="toggleHidden(this)" ${hidden ? 'checked' : ''}>
            👁
        </label>
        <button type="button" class="btn btn-danger btn-icon" onclick="removeField(this)" title="削除">🗑</button>
    `;
    container.appendChild(row);
}

function removeField(btn) {
    btn.closest('.extra-field-row').remove();
}

function toggleHidden(checkbox) {
    const hiddenInput = checkbox.closest('.extra-field-row').querySelector('input[name="field_hidden"]');
    const valueInput = checkbox.closest('.extra-field-row').querySelector('input[name="field_value"]');
    const isHidden = checkbox.checked;
    hiddenInput.value = isHidden ? '1' : '0';
    valueInput.type = isHidden ? 'password' : 'text';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{{end}}
