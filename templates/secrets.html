{{define "secrets_title"}}金融情報{{end}}
{{define "secrets_content"}}
<h2>金融情報</h2>
<p>作動時に受信者へ展開する金融情報やシークレットを管理します。</p>
<a href="/secrets/new" class="btn btn-primary">情報を追加</a>

<table class="data-table sortable-table" data-reorder-url="/secrets/reorder">
    <thead>
        <tr>
            <th class="drag-handle-header"></th>
            <th>タイトル</th>
            <th>更新日時</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {{range .Secrets}}
        <tr draggable="true" data-id="{{.ID}}">
            <td class="drag-handle">⋮⋮</td>
            <td><a href="/secrets/view?id={{.ID}}" class="secret-title-link">{{.Title}}</a></td>
            <td>{{.UpdatedAt.Format "2006-01-02 15:04"}}</td>
            <td>
                <a href="/secrets/edit?id={{.ID}}" class="btn btn-small">編集</a>
                <form method="post" action="/secrets/delete?id={{.ID}}" style="display:inline" onsubmit="return confirm('削除しますか？');">
                    <button type="submit" class="btn btn-danger btn-small">削除</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="4">情報が登録されていません。</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
