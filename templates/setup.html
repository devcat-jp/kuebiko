{{define "setup_title"}}{{t .Lang "initial_setup"}}{{end}}
{{define "setup_content"}}
<div class="card">
    <h2>{{t .Lang "initial_setup"}}</h2>
    <p>{{t .Lang "create_admin"}}</p>
    <form method="post" action="/setup">
        <div class="form-group">
            <label for="password">{{t .Lang "password"}}</label>
            <input type="password" id="password" name="password" required autofocus>
        </div>
        <div class="form-group">
            <label for="confirm">{{t .Lang "password_confirm"}}</label>
            <input type="password" id="confirm" name="confirm" required>
        </div>
        <button type="submit" class="btn btn-primary">{{t .Lang "create"}}</button>
    </form>
</div>
{{end}}
